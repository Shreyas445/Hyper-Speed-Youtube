<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Keep your existing :root and body CSS here */
        :root {
            --bg-color: #0d0d0d;
            --accent-color: #8a2be2;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            width: 320px;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top left, rgba(138, 43, 226, 0.2), transparent 70%);
            z-index: -1;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 18px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(90deg, #ffffff, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .speed-display-container {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--glass-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
        }

        #speedDisplay {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent-color);
        }

        .x-unit {
            font-size: 18px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-left: 5px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin-bottom: 20px;
        }

        input[type=range]:focus { outline: none; }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: var(--border-color);
            border-radius: 3px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
            transition: transform 0.1s ease-in-out;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        /* NEW: Reset Button Styles */
        .reset-btn {
            width: 100%;
            padding: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .reset-btn:hover {
            background: rgba(138, 43, 226, 0.2);
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.2);
        }

        .reset-btn:active {
            transform: scale(0.98);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .control-label {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Keep your switch styles here */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-color); }
        input:focus + .slider { box-shadow: 0 0 1px var(--accent-color); }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>
   <header>
    <h1>HYPERSPEED</h1>
    <img src="assets/icon128.png" width="24" height="24" alt="logo" style="opacity: 0.8">
</header>

    <div class="speed-display-container">
        <span id="speedDisplay">1.00</span><span class="x-unit">x</span>
    </div>

    <input type="range" id="speedSlider" min="0.25" max="26" step="0.25" value="1.0">

    <button id="resetBtn" class="reset-btn">Reset to 1.0x</button>

    <div class="controls">
        <span class="control-label">Floating Bubble</span>
        <label class="switch">
            <input type="checkbox" id="bubbleToggle" checked>
            <span class="slider"></span>
        </label>
    </div>

    <script src="popup.js"></script>
</body>
</html>
